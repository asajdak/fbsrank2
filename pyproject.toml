[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fbsrank"
version = "0.1.0"
description = "College football rankings from multiple algorithms, published as static files"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["fbsrank", "fbsrank.rankers"]
